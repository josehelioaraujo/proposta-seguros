name: CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/**'

jobs:

  # ─── JOB 1: Testes de Unidade ────────────────────────────────────────────────
  test:
    name: Testes de Unidade
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore proposta-seguros.sln

      - name: Build
        run: dotnet build proposta-seguros.sln --no-restore --configuration Release

      - name: Executar testes
        run: dotnet test proposta-seguros.sln --no-build --configuration Release --verbosity normal

  # ─── JOB 2: Testes de Integração — PropostaService ───────────────────────────
  integration-test:
    name: Testes de Integração
    runs-on: ubuntu-latest
    needs: test

    env:
      RUN_INTEGRATION_TESTS: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore tests/PropostaService.IntegrationTests/PropostaService.IntegrationTests.csproj

      - name: Build
        run: dotnet build tests/PropostaService.IntegrationTests/PropostaService.IntegrationTests.csproj --no-restore --configuration Release

      - name: Executar testes de integração
        run: dotnet test tests/PropostaService.IntegrationTests/PropostaService.IntegrationTests.csproj --no-build --configuration Release --verbosity normal

  # ─── JOB 3: Testes de Integração — RabbitMQ ──────────────────────────────────
  integration-test-rabbitmq:
    name: Testes de Integração RabbitMQ
    runs-on: ubuntu-latest
    needs: integration-test

    env:
      RUN_INTEGRATION_TESTS: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore tests/ContratacaoService.IntegrationTests/ContratacaoService.IntegrationTests.csproj

      - name: Build
        run: dotnet build tests/ContratacaoService.IntegrationTests/ContratacaoService.IntegrationTests.csproj --no-restore --configuration Release

      - name: Executar testes de integração RabbitMQ
        run: dotnet test tests/ContratacaoService.IntegrationTests/ContratacaoService.IntegrationTests.csproj --no-build --configuration Release --verbosity normal

  # ─── JOB 4: SonarCloud ───────────────────────────────────────────────────────
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: integration-test-rabbitmq

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java (exigido pelo SonarScanner)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restaurar dependências
        run: dotnet restore proposta-seguros.sln

      - name: Iniciar análise SonarCloud
        run: |
          dotnet sonarscanner begin \
            /k:"josehelioaraujo_proposta-seguros" \
            /o:"josehelioaraujo" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.projectBaseDir="${{ github.workspace }}" \
            /d:sonar.cs.opencover.reportsPaths="${{ github.workspace }}/coverage/proposta.opencover.xml,${{ github.workspace }}/coverage/contratacao.opencover.xml"

      - name: Build para análise
        run: dotnet build proposta-seguros.sln --no-restore --configuration Release

      - name: Executar testes — PropostaService com cobertura
        run: |
          mkdir -p ${{ github.workspace }}/coverage
          dotnet test tests/PropostaService.Tests/PropostaService.Tests.csproj \
            --configuration Release \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            "/p:CoverletOutput=${{ github.workspace }}/coverage/proposta.opencover.xml"

      - name: Executar testes — ContratacaoService com cobertura
        run: |
          dotnet test tests/ContratacaoService.Tests/ContratacaoService.Tests.csproj \
            --configuration Release \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            "/p:CoverletOutput=${{ github.workspace }}/coverage/contratacao.opencover.xml"

      - name: Finalizar análise SonarCloud
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  # ─── JOB 5: Deploy VPS ───────────────────────────────────────────────────────
  deploy:
    name: Deploy VPS
    runs-on: ubuntu-latest
    needs: [ integration-test-rabbitmq, sonar ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # appleboy/ssh-action@v1.2.0 — corrige vulnerabilidade SSH.NET (GHSA-q939-rpr3-3284)
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 2.25.122.11
          username: root
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          script: |
            cd /home/projetos/proposta-seguros
            git pull origin main

            BUILD_VERSION="1.0.${{ github.run_number }}"
            BUILD_COMMIT=$(git rev-parse --short HEAD)
            BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            docker compose --profile monitoring build \
              --build-arg BUILD_VERSION=$BUILD_VERSION \
              --build-arg BUILD_COMMIT=$BUILD_COMMIT \
              --build-arg BUILD_DATE=$BUILD_DATE

            docker compose --profile monitoring up -d

            echo "Deploy concluido - versao $BUILD_VERSION commit $BUILD_COMMIT em $BUILD_DATE"

  # ─── JOB 6: Smoke Tests — Newman ─────────────────────────────────────────────
  newman:
    name: Smoke Tests E2E
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aguardar VPS estabilizar
        run: |
          echo "Aguardando containers subirem..."
          sleep 30
          echo "Verificando health check..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://2.25.122.11:5001/health/live || echo "000")
            echo "Tentativa $i — status: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "VPS pronta!"
              break
            fi
            sleep 10
          done

      - name: Instalar Newman e reporter HTML
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Executar collection Postman
        run: |
          newman run docs/postman/proposta-seguros.postman_collection.json \
            -e docs/postman/env-vps.json \
            --folder "07 — Fluxo VPS PostgreSQL + RabbitMQ" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export newman-report/index.html \
            --reporter-htmlextra-title "Proposta de Seguros — Evidências de Testes E2E" \
            --reporter-htmlextra-darkTheme \
            --suppress-exit-code

      - name: Publicar relatório no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./newman-report
          publish_branch: gh-pages
          commit_message: "ci: atualiza relatorio de testes E2E"
