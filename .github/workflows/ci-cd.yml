name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ─── JOB 1: Testes de Unidade ────────────────────────────────────────────────
  test:
    name: Testes de Unidade
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore proposta-seguros.sln

      - name: Build
        run: dotnet build proposta-seguros.sln --no-restore --configuration Release

      - name: Executar testes
        run: dotnet test proposta-seguros.sln --no-build --configuration Release --verbosity normal

  # ─── JOB 2: SonarCloud ───────────────────────────────────────────────────────
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java (exigido pelo SonarScanner)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restaurar dependências
        run: dotnet restore proposta-seguros.sln

      - name: Iniciar análise SonarCloud
        run: |
          dotnet sonarscanner begin \
            /k:"josehelioaraujo_proposta-seguros" \
            /o:"josehelioaraujo" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io"

      - name: Build para análise
        run: dotnet build proposta-seguros.sln --no-restore --configuration Release

      - name: Finalizar análise SonarCloud
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  # ─── JOB 3: Deploy VPS ───────────────────────────────────────────────────────
  deploy:
    name: Deploy VPS
    runs-on: ubuntu-latest
    needs: [ test, sonar ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 2.25.122.11
          username: root
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          script: |
            cd /home/projetos/proposta-seguros
            git pull origin main

            BUILD_VERSION="1.0.0"
            BUILD_COMMIT=$(git rev-parse --short HEAD)
            BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            docker compose build --no-cache \
              --build-arg BUILD_VERSION=$BUILD_VERSION \
              --build-arg BUILD_COMMIT=$BUILD_COMMIT \
              --build-arg BUILD_DATE=$BUILD_DATE

            docker compose up -d

            echo "✅ Deploy concluído — versão $BUILD_VERSION commit $BUILD_COMMIT em $BUILD_DATE"
