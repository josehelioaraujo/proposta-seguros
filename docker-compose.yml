services:

  postgres:
    image: postgres:16-alpine
    container_name: seguros-postgres
    environment:
      POSTGRES_DB:       seguros_db
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seguros_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seguros-network

  proposta-api:
    build:
      context: .
      dockerfile: src/PropostaService/Dockerfile
    container_name: proposta-api
    ports:
      - "5001:5001"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=seguros_db;Username=postgres;Password=postgres"
      Features__UsarBancoDados: ${USAR_BANCO_DADOS:-false}
      Features__UsarRabbitMQ:   ${USAR_RABBITMQ:-false}
      Features__UsarKafka:     ${USAR_KAFKA:-false}
      Kafka__BootstrapServers: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: "proposta-api"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - seguros-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"

  contratacao-api:
    build:
      context: .
      dockerfile: src/ContratacaoService/Dockerfile
    container_name: contratacao-api
    ports:
      - "5002:5002"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=seguros_db;Username=postgres;Password=postgres"
      Features__UsarBancoDados: ${USAR_BANCO_DADOS:-false}
      Features__UsarRabbitMQ:   ${USAR_RABBITMQ:-false}
      Features__UsarKafka:     ${USAR_KAFKA:-false}
      Kafka__BootstrapServers: kafka:9092
      Services__PropostaService: "http://proposta-api:5001"
      RabbitMQ__Host: seguros-rabbitmq
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: "contratacao-api"
    depends_on:
      postgres:
        condition: service_healthy
      proposta-api:
        condition: service_started
    networks:
      - seguros-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: seguros-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seguros-network
    profiles:
      - rabbitmq

  adminer:
    image: adminer
    container_name: seguros-adminer
    ports:
      - "5050:8080"
    networks:
      - seguros-network
    profiles:
      - tools

  # ---------------------------------------------------------------------------
  # Observability â€” profile: monitoring
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: seguros-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - seguros-network
    profiles:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: seguros-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - seguros-network
    profiles:
      - monitoring
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: seguros-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    networks:
      - seguros-network
    profiles:
      - monitoring
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: seguros-loki
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - seguros-network
    profiles:
      - monitoring
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: seguros-promtail
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - seguros-network
    profiles:
      - monitoring
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # AI â€” profile: ai
  # ---------------------------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: seguros-open-webui
    environment:
      - OLLAMA_BASE_URL=http://172.18.0.1:11434
      - WEBUI_NAME=Assistente de Seguros
      - WEBUI_SECRET_KEY=seguros-secret-key
    ports:
      - "8080:8080"
    volumes:
      - open_webui_data:/app/backend/data
    networks:
      - seguros-network
    profiles:
      - ai
    restart: unless-stopped


  # ---------------------------------------------------------------------------
  # Kafka KRaft + Kafka UI — profile: kafka
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: seguros-kafka
    hostname: seguros-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://seguros-kafka:9092,CONTROLLER://seguros-kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://seguros-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@seguros-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - seguros-network
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "seguros-kafka:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
    profiles:
      - kafka

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: seguros-kafka-ui
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - seguros-network
    profiles:
      - kafka

volumes:
  postgres_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  loki_data:
  open_webui_data:
  kafka_data:

networks:
  seguros-network:
    driver: bridge
