services:

  postgres:
    image: postgres:16-alpine
    container_name: seguros-postgres
    environment:
      POSTGRES_DB:       seguros_db
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seguros_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seguros-network

  proposta-api:
    build:
      context: .
      dockerfile: src/PropostaService/Dockerfile
    container_name: proposta-api
    ports:
      - "5001:5001"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=seguros_db;Username=postgres;Password=postgres"
      Features__UsarBancoDados: ${USAR_BANCO_DADOS:-false}
      Features__UsarRabbitMQ:   ${USAR_RABBITMQ:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: "proposta-api"
      Ollama__BaseUrl: "http://host.gateway.internal:11434"
    extra_hosts:
      - "host.gateway.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - seguros-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"

  contratacao-api:
    build:
      context: .
      dockerfile: src/ContratacaoService/Dockerfile
    container_name: contratacao-api
    ports:
      - "5002:5002"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=seguros_db;Username=postgres;Password=postgres"
      Features__UsarBancoDados: ${USAR_BANCO_DADOS:-false}
      Features__UsarRabbitMQ:   ${USAR_RABBITMQ:-false}
      Services__PropostaService: "http://proposta-api:5001"
      RabbitMQ__Host: seguros-rabbitmq
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: "contratacao-api"
      Ollama__BaseUrl: "http://host.gateway.internal:11434"
    extra_hosts:
      - "host.gateway.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      proposta-api:
        condition: service_started
    networks:
      - seguros-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: seguros-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seguros-network
    profiles:
      - rabbitmq

  adminer:
    image: adminer
    container_name: seguros-adminer
    ports:
      - "5050:8080"
    networks:
      - seguros-network
    profiles:
      - tools

  # ---------------------------------------------------------------------------
  # Observability — profile: monitoring
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: seguros-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - seguros-network
    profiles:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: seguros-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - seguros-network
    profiles:
      - monitoring
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: seguros-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - seguros-network
    profiles:
      - monitoring
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: seguros-loki
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - seguros-network
    profiles:
      - monitoring
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: seguros-promtail
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - seguros-network
    profiles:
      - monitoring
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # AI — profile: ai
  # ---------------------------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: seguros-open-webui
    environment:
      - OLLAMA_BASE_URL=http://host.gateway.internal:11434
      - WEBUI_NAME=Assistente de Seguros
      - WEBUI_SECRET_KEY=seguros-secret-key
    extra_hosts:
      - "host.gateway.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - open_webui_data:/app/backend/data
    networks:
      - seguros-network
    profiles:
      - ai
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  loki_data:
  open_webui_data:

networks:
  seguros-network:
    driver: bridge
